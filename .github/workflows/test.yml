name: Teste Automate CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Poți schimba dacă folosești altă versiune specifică
        
    - name: Install Backend Dependencies
      run: |
        cd backend-django
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Django Tests
      run: |
        cd backend-django
        python manage.py test components

  test-frontend:
    name: Frontend Tests (Vue)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Verificat din engines în package.json
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend-vue
        npm install
        # Instalăm și uneltele de testare în caz că nu au fost adăugate în package.json
        npm install -D vitest @vue/test-utils jsdom
        
    - name: Run Vue Tests
      run: |
        cd frontend-vue
        npm run test:unit
