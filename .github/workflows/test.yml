name: Teste Automate CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: pc_builder_sim
          MYSQL_USER: radupcb
          MYSQL_PASSWORD: rm123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: pc_builder_sim
      DB_USER: radupcb
      DB_PASSWORD: rm123456
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Backend Dependencies
      run: |
        cd backend-django
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Django Tests
      run: |
        cd backend-django
        python manage.py test components accounts

  test-frontend:
    name: Frontend Tests (Vue)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend-vue
        npm install
        npm install -D vitest @vue/test-utils jsdom

    - name: Run Vue Tests
      run: |
        cd frontend-vue
        npm run test:unit
